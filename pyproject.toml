[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-rover-agent"
version = "3.0.0"
description = "Laya Rover Agent - safety-first, confidence-aware autonomous rover navigation agent (simulation + rover-ready hardware bridge) with a self-hosted Laya decision layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Laya Rover Project" }]
keywords = ["rover", "autonomy", "laya", "decision-model", "safety-guardian"]

dependencies = [
    "httpx>=0.27,<1.0",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "PyYAML>=6.0,<7.0",
    "rich>=13.7,<14.0",
    "scipy>=1.12,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "respx>=0.21,<1.0"]
hardware = ["pyserial>=3.5,<4.0"]

[project.scripts]
laya-rover = "laya_rover_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: requires real network + real LAYA_API_KEY (excluded from default runs)",
]
filterwarnings = ["ignore::DeprecationWarning"]
